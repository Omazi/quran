name: iOS check

# Compiles the app for iPhone on a Mac hosted by GitHub. No secret is used and nothing is sent to
# Apple: the build is unsigned. Nobody on the project has a Mac, so this is the only place where
# the native build is verified (docs/BUILD.md).
#
# Two jobs:
#  - "iPhone build" says whether the app compiles. It decides the result of the workflow.
#  - "First screen" starts the app in the iPhone simulator and keeps a picture of each screen (the
#    pages of the introduction, the tabs, the reader in both scripts, the listening screen...).
#    It is reported, never blocking: the pictures are there to be looked at. The workflow
#    "iOS screens" then puts them on the branch `ci-screens`. It ends with the "crash hunt": on a
#    fresh install the app swipes through the whole introduction by itself, then works the 3D
#    garden of a friend's page; if its process dies, the step summary says CRASH and the crash
#    reports and logs are in the artifact (docs/BUILD.md, "Diagnostic d'une fermeture").
#
# There is deliberately no `pull_request` trigger: the repository is public, and a pull request
# from a stranger must not start Mac jobs here.
#
# A push starts the Macs only when it touches what the app is built from. Documentation alone
# does not: a check takes about 45 minutes of Mac.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'modules/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tools/ci/select-xcode.sh'
      - 'tools/ci/pick-simulator.py'
      - 'tools/ci/screens.py'
      - 'tools/ci/crash-report.py'
      - '.github/workflows/ios-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  build:
    name: iPhone build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Select the newest released Xcode and record versions
        run: bash tools/ci/select-xcode.sh
      - run: npm ci
      - name: Generate the iOS project and install its pods
        run: npx expo prebuild --platform ios
      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace: $WORKSPACE, scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build > build/xcodebuild.log 2>&1 \
            || { grep -E "error:" build/xcodebuild.log | sort -u | cut -c1-400 | head -60; tail -60 build/xcodebuild.log; exit 1; }
          grep -E "BUILD SUCCEEDED" build/xcodebuild.log
      - name: Check what the app contains
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP ($(du -sh "$APP" | cut -f1))"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.omazi.quran"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          # The JavaScript of the app, compiled into the bundle.
          test -s "$APP/main.jsbundle"
          # The Quran font travels with the app: without it the text would fall back to a system font.
          find "$APP" -name "KFGQPC-HAFS-Uthmanic-Script-v0.18.ttf" | grep -q .
          # The voice model, byte for byte: without it recognition fails on the phone.
          bash tools/ci/check-voice-model.sh "$APP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ios-build-log
          path: build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

  first-screen:
    name: First screen
    runs-on: macos-26
    # The build takes about 45 minutes, then each screen is launched and photographed once.
    timeout-minutes: 120
    # Reported, not blocking: see the header.
    continue-on-error: true
    env:
      # The test build shows the preview of the garden's states (src/features/home/state-preview.ts).
      EXPO_PUBLIC_STATE_PREVIEW: '1'
      # This build can open each screen by a launch argument and fill the app with a made-up history
      # (src/features/screen-check). Set here only: never in a published build (docs/BUILD.md).
      EXPO_PUBLIC_SCREEN_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Select the newest released Xcode and record versions
        run: bash tools/ci/select-xcode.sh
      - run: npm ci
      - name: Generate the iOS project and install its pods
        run: npx expo prebuild --platform ios
      - name: Start an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 tools/ci/pick-simulator.py)
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          sleep 20   # the home screen is still settling right after the start
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p build/screens
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination "platform=iOS Simulator,id=$SIM_UDID" -derivedDataPath build/SimData \
            build > build/sim-build.log 2>&1 \
            || { grep -E "error:" build/sim-build.log | sort -u | cut -c1-400 | head -60; tail -60 build/sim-build.log; exit 1; }
      - name: Open the app on each screen and keep a picture of it
        run: |
          APP=$(find build/SimData/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$SIM_UDID" "$APP"
          # The very first launch of an app on a fresh simulator can take a minute: done once, unrecorded.
          xcrun simctl launch "$SIM_UDID" com.omazi.quran || true
          sleep 40
          xcrun simctl terminate "$SIM_UDID" com.omazi.quran || true
          # The list of pictures is tools/ci/screens.py (also what publish-screens.py keeps). A screen
          # is opened by launch arguments that only this build understands (src/features/screen-check);
          # a picture is taken whether or not the screen came up, and a failure never stops the loop.
          CURRENT_LANG=en
          CURRENT_LOOK=""
          shot() {  # name appearance language locale screen page script seed seconds-to-wait
            local name=$1 look=$2 lang=$3 locale=$4 screen=$5 page=$6 script=$7 seed=$8 wait=$9
            if [ "$look" != "$CURRENT_LOOK" ]; then
              xcrun simctl ui "$SIM_UDID" appearance "$look" || true
              CURRENT_LOOK=$look
              sleep 3
            fi
            # Arabic mirrors the layout and the app restarts itself once to do it, in both directions:
            # a first launch brings the app to the writing direction, the next one is photographed.
            if [ "$lang" != "$CURRENT_LANG" ] && { [ "$lang" = ar ] || [ "$CURRENT_LANG" = ar ]; }; then
              xcrun simctl launch "$SIM_UDID" com.omazi.quran -AppleLanguages "($lang)" -AppleLocale "$locale" || true
              sleep 15
              xcrun simctl terminate "$SIM_UDID" com.omazi.quran || true
              sleep 2
            fi
            CURRENT_LANG=$lang
            local args=(-AppleLanguages "($lang)" -AppleLocale "$locale" -screenCheckGo "$screen")
            [ "$page" = "-" ] || args+=(-screenCheckPage "$page")
            [ "$script" = "-" ] || args+=(-screenCheckScript "$script")
            [ "$seed" = "-" ] || args+=(-screenCheckSeed "$seed")
            xcrun simctl launch "$SIM_UDID" com.omazi.quran "${args[@]}" || true
            sleep "$wait"   # idle: the screen is drawn and its texts and fonts are loaded
            xcrun simctl io "$SIM_UDID" screenshot "build/screens/$name.png" || true
            xcrun simctl terminate "$SIM_UDID" com.omazi.quran || true
          }
          python3 tools/ci/screens.py plan > build/screens-plan.tsv
          wc -l build/screens-plan.tsv
          while IFS=$'\t' read -r name look lang locale screen page script seed wait; do
            echo "== $name"
            shot "$name" "$look" "$lang" "$locale" "$screen" "$page" "$script" "$seed" "$wait"
          done < build/screens-plan.tsv
          ls -la build/screens | tail -n +2 | wc -l
      - name: Crash hunt (the app swipes the introduction and works a friend's garden by itself)
        run: |
          # The owner's phone closes the app (1) swiping through the first launch, (2) on a friend's
          # garden after a pinch, "Encourager" and a scroll, with no log to read. This reproduces both
          # paths in the simulator, with no touch: the check build, asked with -screenCheckAutoSwipe 1,
          # drives the pager's own gesture code and the garden's controller itself
          # (src/features/screen-check/auto-run.tsx). Reported, never blocking.
          APPID=com.omazi.quran
          APP=$(find build/SimData/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          mkdir -p build/crash
          alive() {  # the app's process, as the simulator lists it: a number in the first column
            # awk reads everything, so no early exit can break a pipe under "pipefail".
            xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null \
              | awk -v label="UIKitApplication:$APPID" 'index($0, label) && $1 ~ /^[0-9]+$/ { found = 1 } END { exit !found }'
          }
          xcrun simctl terminate "$SIM_UDID" "$APPID" || true
          # A fresh install: first launch, nothing saved (the introduction comes first), no old record.
          xcrun simctl uninstall "$SIM_UDID" "$APPID" || true
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl ui "$SIM_UDID" appearance light || true
          touch build/crash/started
          xcrun simctl launch "$SIM_UDID" "$APPID" -AppleLanguages "(fr)" -AppleLocale fr_FR \
            -screenCheckGo onboarding -screenCheckAutoSwipe 1 || true
          DATA=$(xcrun simctl get_app_container "$SIM_UDID" "$APPID" data 2>/dev/null || true)
          FINISHED=no
          # The swipes take about 40 seconds, the friend's page about a minute more, and the first
          # start of the app can take a while: wait up to 6 minutes, stop as soon as it ends or dies.
          for i in $(seq 1 72); do
            sleep 5
            if [ -n "$DATA" ] && grep -q "auto-run: DONE" "$DATA/Documents/auto-run-progress.txt" 2>/dev/null; then FINISHED=yes; break; fi
            alive || break
          done
          if alive; then ALIVE=1; else ALIVE=0; fi
          xcrun simctl io "$SIM_UDID" screenshot build/crash/last-screen.png || true
          [ -n "$DATA" ] && cp "$DATA/Documents/auto-run-progress.txt" build/crash/auto-run-progress.txt 2>/dev/null || true
          [ -n "$DATA" ] && cp "$DATA/Documents/last-closure.json" build/crash/last-closure.json 2>/dev/null || true
          sleep 5   # the crash report is written a moment after the process ends
          for report in "$HOME"/Library/Logs/DiagnosticReports/*.ips; do
            [ -e "$report" ] || continue
            if [ "$report" -nt build/crash/started ] && grep -q "$EXE" "$report"; then cp "$report" build/crash/; fi
          done
          xcrun simctl spawn "$SIM_UDID" log show --style compact --info --debug --last 15m \
            --predicate "process == \"$EXE\"" > build/crash/simulator-log.txt 2>&1 || true
          tail -n 300 "$HOME/Library/Logs/CoreSimulator/$SIM_UDID/system.log" > build/crash/coresimulator-log.txt 2>/dev/null || true
          VERDICT=$(python3 -I tools/ci/crash-report.py --progress build/crash/auto-run-progress.txt \
            --closure build/crash/last-closure.json --ips-dir build/crash --log build/crash/simulator-log.txt \
            --alive "$ALIVE" --out build/crash/crash-report.txt)
          xcrun simctl terminate "$SIM_UDID" "$APPID" || true
          {
            echo "### Crash hunt: $VERDICT"
            echo
            echo "The app swiped through the introduction and worked a friend's garden by itself (finished: $FINISHED, process alive at the end: $ALIVE)."
            echo
            echo '```'
            head -n 40 build/crash/crash-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$VERDICT" = "CRASH" ]; then echo "::warning title=CRASH::the app died during the crash hunt, see crash-report.txt in the artifact ios-first-screen"; fi
          echo "crash hunt: $VERDICT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ios-first-screen
          path: |
            build/screens/*.png
            build/sim-build.log
            build/crash/*.txt
            build/crash/*.json
            build/crash/*.ips
            build/crash/last-screen.png
          if-no-files-found: warn
          retention-days: 14
